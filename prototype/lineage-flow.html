<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataOps · 血缘图谱</title>
<link rel="stylesheet" href="vendor/reactflow.css">
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<style>
  :root{
    --bg:var(--dsw-alias-bg-l1,#f7f7f8);
    --panel:var(--dsw-alias-bg-overlay,#fff);
    --panel2:var(--dsw-alias-bg-l2,#f4f5f7);
    --text:var(--dsw-alias-label-primary,#0f1115);
    --muted:var(--dsw-alias-label-secondary,#61666b);
    --faint:var(--dsw-alias-label-tertiary,#8b9098);
    --line:var(--dsw-alias-border-l1,rgba(0,0,0,.06));
    --line2:var(--dsw-alias-border-l2,rgba(0,0,0,.1));
    --brand:var(--dsw-alias-brand-primary,#4d6bfe);
    --brand-bg:var(--dsw-alias-brand-primary-bg,#eef2ff);
    --purple:#7c5cff; --teal:#0f8a7b; --orange:#b45309; --green:#067647; --red:#b42318;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:12px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  .app{height:100%;display:flex;flex-direction:column}
  .top{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px 0}
  .crumb{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:11px;height:24px}
  .crumb .brand{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-weight:600}
  .crumb .mark{width:15px;height:15px;color:var(--brand)}
  .crumb b{color:var(--text);font-weight:600}
  .bar{display:flex;align-items:center;gap:10px;height:38px}
  .title{display:flex;align-items:center;gap:8px;min-width:0}
  .title h1{font-size:13px;line-height:1;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:10px;line-height:1;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:3px 7px;background:var(--panel2);font-weight:600;white-space:nowrap}
  .tag.target{color:var(--brand);border-color:#c7d2fe;background:var(--brand-bg)}
  .spacer{flex:1}
  .tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px}
  .tab{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
  .tab[data-active="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.08)}
  .tool{border:1px solid var(--line2);background:var(--panel);color:var(--muted);font:inherit;font-size:11px;font-weight:600;height:26px;padding:0 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .tool:hover{color:var(--text);border-color:#c8cedb}
  .legend{display:flex;align-items:center;gap:12px;height:26px;color:var(--faint);font-size:10.5px;overflow:hidden;white-space:nowrap}
  .lg{display:inline-flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:2px;display:inline-block;flex:none}
  .body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
  .canvas-wrap{position:relative;min-width:0;min-height:0;background:var(--bg)}
  #flow{position:absolute;inset:0}
  .hint{position:absolute;left:12px;bottom:10px;z-index:5;color:var(--faint);font-size:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 7px;pointer-events:none}
  .detail{background:var(--panel);border-left:1px solid var(--line);min-height:0;display:flex;flex-direction:column}
  .detail-head{padding:14px 14px 10px;border-bottom:1px solid var(--line);flex:none}
  .eyebrow{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .detail-head h2{font-size:14px;line-height:1.35;margin:6px 0 3px;font-weight:600;word-break:break-all}
  .detail-sub{font-size:10.5px;color:var(--muted);line-height:1.45}
  .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .pill{font-size:9.5px;line-height:1;font-weight:600;border:1px solid var(--line2);border-radius:999px;padding:3px 6px;color:var(--muted);background:var(--panel2)}
  .pill.brand{color:var(--brand);border-color:#c7d2fe;background:var(--brand-bg)}
  .detail-tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);flex:none}
  .dt{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:600;padding:5px 8px 7px;border-bottom:2px solid transparent;cursor:pointer}
  .dt[data-active="true"]{color:var(--text);border-bottom-color:var(--brand)}
  .detail-body{padding:12px 14px 20px;overflow:auto;min-height:0}
  .desc{color:var(--muted);font-size:11.5px;line-height:1.6;margin:0 0 10px}
  .kv{display:grid;grid-template-columns:74px minmax(0,1fr);gap:7px 10px;margin:0;font-size:11px;line-height:1.5}
  .kv dt{color:var(--faint)}
  .kv dd{margin:0;color:var(--text);word-break:break-all}
  .section-title{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:14px 0 6px}
  .fields{width:100%;border-collapse:collapse;font-size:10.5px}
  .fields th{text-align:left;color:var(--faint);font-weight:600;padding:4px;border-bottom:1px solid var(--line)}
  .fields td{padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
  .fields td:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
  .fields td:nth-child(2){color:var(--muted);white-space:nowrap}
  .fields td:last-child{color:var(--faint)}
  .sql{margin:0;padding:9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font:10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
  .jobs{display:flex;flex-direction:column;gap:5px}
  .job-row{display:flex;align-items:center;gap:7px;font-size:11px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
  .job-row .idx{width:16px;height:16px;border-radius:4px;background:var(--panel2);color:var(--muted);font-size:9px;display:flex;align-items:center;justify-content:center;flex:none}
  .job-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .job-row .kind{font-size:9px;color:var(--faint);flex:none}
  .detail-foot{padding:9px 14px;border-top:1px solid var(--line);display:flex;gap:6px;flex:none}
  .empty{color:var(--muted);font-size:11.5px;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--text);color:var(--panel);font-size:11px;border-radius:6px;padding:6px 10px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  /* React Flow rich node */
  .react-flow__renderer{cursor:grab}
  .react-flow__node{font-family:inherit}
  .react-flow__node-rich{width:240px!important}
  .rf-card{display:flex;align-items:center;gap:8px;min-height:58px;width:240px;padding:7px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);box-shadow:0 1px 2px rgba(15,23,42,.04);cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .rf-card:hover{border-color:#b9c4d8;box-shadow:0 4px 14px rgba(15,23,42,.08)}
  .rf-card.selected{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-bg),0 4px 14px rgba(15,23,42,.08)}
  .rf-card.target{border-color:#a9b9ff;background:#fbfcff}
  .rf-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
  .rf-icon img{width:18px;height:18px;object-fit:contain;display:block}
  .rf-main{min-width:0;flex:1}
  .rf-title{font-size:10.5px;font-weight:650;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .rf-sub{font-size:9px;line-height:1.35;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .rf-kind{font-size:8px;line-height:1;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 4px;flex:none;font-weight:700;align-self:flex-start;margin-top:1px}
  .react-flow__handle{width:6px;height:6px;border:0;background:transparent;opacity:0}
  .react-flow__node-taskGroup{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important}
  .react-flow__edges{position:absolute;z-index:6!important}
  .react-flow__nodes{position:absolute;z-index:2!important}
  .react-flow__node-taskGroup{background:transparent!important;border:0!important;padding:0!important;box-shadow:none!important}
.rf-group{width:100%;height:100%;border:1px dashed #d9a24f;border-radius:10px;background:rgba(255,247,234,.06);position:relative}
  .rf-group-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .rf-group-head{position:absolute;top:7px;left:9px;display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;color:#8a4b0f;background:rgba(255,255,255,.72);border:1px solid #f2d3a4;border-radius:4px;padding:3px 5px;white-space:nowrap}
  .rf-group-head img{width:12px;height:12px}
  .react-flow__edge-text{font-size:8px;fill:#7b8494}
  .react-flow__edge-textbg{fill:var(--bg)}
  .react-flow__controls{box-shadow:none;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .react-flow__controls-button{border-bottom:1px solid var(--line);background:var(--panel);color:var(--muted);width:24px;height:24px}
  .lane-label{position:absolute;font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.04em;text-align:left;pointer-events:none;border-bottom:1px dashed var(--line2);padding-bottom:4px}
  .react-flow__attribution{display:none}
  @media (max-width:980px){.body{grid-template-columns:1fr}.detail{display:none}}
</style>
</head>
<body>
<div class="app" id="root"></div>
<script>
const React = window.React;
const ReactDOM = window.ReactDOM;
const RF = window.ReactFlow;
const h = React.createElement;
const { ReactFlow, ReactFlowProvider, Background, Controls, Handle, Position, MarkerType, applyNodeChanges, useReactFlow, ViewportPortal } = RF;

const ICON = {
  hive: 'vendor/icons/apachehive.svg',

const INFO = {
  'table:dws.trade_channel_daily': {

const N = (id, name, kind, meta, icon, iconBg, extra) => Object.assign({ id, name, kind, meta, icon, iconBg }, extra || {});
const E = (source, target, kind, label) => ({ id: source + '>' + target, source, target, kind, label });

const VIEWS = {
  design: {

      { label: '消费', ids: ['report:channel_dashboard', 'cache:report_cache', 'api:report_service', 'table:archive.channel_report'] }
    ]
  }
};

function gridLayout(nodes, view) {
  const spec = GRID[view];
  if (!spec) return { nodes, lanes: [] };
  const W = 240, H = 62, GX = 30, GY = 58, LEFT = 20, TOP = 30;
  const byId = {};
  nodes.forEach(n => { byId[n.id] = n; });
  const positions = {};
  const lanes = [];
  spec.rows.forEach((row, rowIndex) => {
    lanes.push({ label: row.label, x: 10, y: TOP + rowIndex * (H + GY) - 26, width: W });
    row.ids.forEach((id, col) => {
      positions[id] = { x: LEFT + col * (W + GX), y: TOP + rowIndex * (H + GY) };
    });
  });
  return {
    nodes: nodes.map(n => positions[n.id] ? Object.assign({}, n, { position: positions[n.id] }) : n),
    lanes
  };
}

function routeEdges(nodes, edges) {
  const byId = {};
  nodes.forEach(n => { byId[n.id] = n; });
  const offsetOf = n => {
    const p = n.parentId ? byId[n.parentId] : null;
    return p ? { x: p.position.x, y: p.position.y } : { x: 0, y: 0 };
  };
  const abs = n => {
    const o = offsetOf(n);
    return { x: n.position.x + o.x, y: n.position.y + o.y, w: (n.style && n.style.width) || n.width || 240, h: (n.style && n.style.height) || n.height || 62 };
  };
  return edges.map(edge => {
    const s = byId[edge.source], t = byId[edge.target];
    if (!s || !t) return edge;
    const a = abs(s), b = abs(t);
    const dx = b.x - a.x, dy = b.y - a.y;
    let sourceHandle, targetHandle;
    if (Math.abs(dy) > Math.abs(dx) * 0.65) {
      if (dy >= 0) { sourceHandle = 'bottom-out'; targetHandle = 'top-in'; }
      else { sourceHandle = 'top-out'; targetHandle = 'bottom-in'; }
    } else if (dx >= 0) { sourceHandle = 'right-out'; targetHandle = 'left-in'; }
    else { sourceHandle = 'left-out'; targetHandle = 'right-in'; }
    return Object.assign({}, edge, { sourceHandle, targetHandle });
  });
}

function validateLayout(nodes) {
  const byId = {};
  nodes.forEach(n => { byId[n.id] = n; });
  const abs = n => {
    const p = n.parentId ? byId[n.parentId] : null;
    return { x: n.position.x + (p ? p.position.x : 0), y: n.position.y + (p ? p.position.y : 0), w: n.width || 240, h: n.height || 62 };
  };
  const rects = nodes.filter(n => n.type === 'rich').map(n => Object.assign({ id: n.id }, abs(n)));
  const overlaps = [];
  for (let i = 0; i < rects.length; i += 1) {
    for (let j = i + 1; j < rects.length; j += 1) {
      const a = rects[i], b = rects[j];
      const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
      const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
      if (ox > 0.5 && oy > 0.5) overlaps.push(a.id + ' x ' + b.id);
    }
  }
  if (overlaps.length) console.warn('DataOps layout overlap:', overlaps);
  return overlaps.length;
}

function buildFlow(view) {
  const def = VIEWS[view];
  const edges = def.edges.map(e => ({
    id: e.id, source: e.source, target: e.target, type: 'smoothstep',
    label: e.label,
    markerEnd: { type: MarkerType.ArrowClosed, color: e.kind === 'control' ? '#c27a16' : e.kind === 'call' ? '#9a7cf0' : '#7d99ea' },
    style: {
      stroke: e.kind === 'control' ? '#c27a16' : e.kind === 'call' ? '#9a7cf0' : e.kind === 'maps_to' ? '#b3a1e8' : '#7d99ea',
      strokeWidth: e.kind === 'control' ? 2.4 : 1.2,
      strokeDasharray: e.kind === 'control' ? '5 3' : e.kind === 'maps_to' ? '3 3' : undefined
    },
    labelStyle: { fontSize: 8, fill: e.kind === 'control' ? '#9a5d0b' : '#7b8494', fontWeight: e.kind === 'control' ? 600 : 400 },
    labelBgStyle: { fill: e.kind === 'control' ? '#fffaf0' : '#f7f7f8', fillOpacity: 1 },
    labelBgPadding: [3, 2],
    labelBgBorderRadius: 3
  }));
  if (def.groups) {
    const groups = def.groups.map(g => ({
      id: g.id, type: 'taskGroup', position: { x: g.x, y: g.y },
      style: { width: g.w, height: g.h }, data: { label: g.label, icon: g.icon, links: g.links, w: g.w, h: g.h },
      selectable: true, draggable: false, zIndex: 0
    }));
    const groupById = {};
    def.groups.forEach(g => { groupById[g.id] = g; });
    const children = def.nodes.map(n => {
      const parent = groupById[n.parentId];
      return {
        id: n.id, type: 'rich',
        position: { x: n.x + (parent ? parent.x : 0), y: n.y + (parent ? parent.y : 0) },
        data: nodeData(n), width: 240, height: 62, zIndex: 2
      };
    });
    const allNodes = groups.concat(children);
    return { nodes: allNodes, edges: routeEdges(allNodes, edges), lanes: [] };
  }
  let nodes = def.nodes.map(n => ({
    id: n.id, type: 'rich', position: n.x !== undefined ? { x: n.x, y: n.y } : { x: 0, y: 0 },
    data: nodeData(n), width: 240, height: 62
  }));
  const laid = gridLayout(nodes, view);
  return { nodes: laid.nodes, edges: routeEdges(laid.nodes, edges), lanes: laid.lanes };
}

  React.useEffect(() => {
    const flow = buildFlow(view);
    setNodes(flow.nodes);
    setEdges(flow.edges);
    setLanes(flow.lanes || []);
    const target = flow.nodes.find(n => n.data && n.data.target);

    const primary = view === 'schedule' ? taskGroup : (target || flow.nodes.find(n => n.type === 'rich'));
    setSelectedId(primary ? primary.id : null);

    const timer = setTimeout(() => setToast(''), 1600);
    return () => clearTimeout(timer);
  }, [toast]);

  function fitAll(ns) {
    const container = document.getElementById('flow');
    if (!container || !ns.length) return;
    const rect = container.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const byId = {};
    ns.forEach(n => { byId[n.id] = n; });
    function abs(n) {
      if (!n.parentId) return n.position;
      const parent = byId[n.parentId];
      return { x: n.position.x + (parent ? parent.position.x : 0), y: n.position.y + (parent ? parent.position.y : 0) };
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    ns.forEach(n => {
      const pos = abs(n);
      const w = n.style && n.style.width ? n.style.width : (n.width || 240);
      const h = n.style && n.style.height ? n.style.height : (n.height || 62);
      minX = Math.min(minX, pos.x); minY = Math.min(minY, pos.y);
      maxX = Math.max(maxX, pos.x + w); maxY = Math.max(maxY, pos.y + h);
    });
    const pad = 34;
    const zoom = Math.min(1.05, Math.max(0.35, Math.min((rect.width - pad * 2) / (maxX - minX), (rect.height - pad * 2) / (maxY - minY))));
    const x = (rect.width - (maxX - minX) * zoom) / 2 - minX * zoom;
    const y = (rect.height - (maxY - minY) * zoom) / 2 - minY * zoom;
    setViewport({ x, y, zoom });
  }

        h('button', { className: 'tool', onClick: () => stress() }, '100 节点')),
      h('div', { className: 'legend' },
        ['业务对象', '逻辑实体', '物理表', '调度任务', '作业', 'API / 缓存', '报表'].map((label, i) => h('span', { key: label, className: 'lg' }, h('i', { className: 'dot', style: { background: ['#7c5cff', '#0f8a7b', '#fff', '#fff7ea', '#b45309', '#fff', '#067647'][i], border: [0, 0, '1.3px solid #94a3b8', '1.3px dashed #b45309', 0, '1.3px solid #7c5cff', 0][i] } }), label)),
        h('span', { className: 'lg' }, '点击节点查看库/schema/字段、调度和 SQL'),
        h('span', { className: 'spacer' }),
        h('span', { className: 'lg' }, 'React Flow · 富节点'))),
    h('main', { className: 'body' },
      h('section', { className: 'canvas-wrap' },
        view === 'schedule' ? h('div', { className: 'schedule-deps' },
          h('span', null, '依赖窗口'),
          h('b', null, 'dwd.orders@T-1'),
          h('em', null, '·'),
          h('b', null, 'dim.channel'),
          h('em', null, '→'),
          h('b', null, 'task 渠道日报'),
          h('em', null, '→'),
          h('b', null, 'task 缓存刷新'), h('span', { style: { color: '#a8a094' } }, '· 虚线 = 调度/产出依赖')) : null,
        h('div', { id: 'flow' },
          h(ReactFlow, {
            nodes, edges, nodeTypes,
            onNodesChange, onNodeClick, onPaneClick,
            fitView: false, minZoom: 0.2, maxZoom: 1.8,
            nodesDraggable: true, nodesConnectable: false, elementsSelectable: true,
            proOptions: { hideAttribution: true }
          },
            h(Background, { gap: 20, size: 1, color: '#d9dee8' }),
            h(Controls, { showInteractive: false }),
            h(ViewportPortal, null, lanes.map(lane => h('div', { key: lane.label, className: 'lane-label', style: { left: lane.x, top: lane.y, width: lane.width } }, lane.label)))
          )),
        h('div', { className: 'hint' }, '点击节点看详情 · 滚轮缩放 · 拖拽平移')),
      h('aside', { className: 'detail' }, h(Detail, { info, selected, selectedId, tab, setTab, setSelectedId, setToast }))),
    toast ? h('div', { className: 'toast show' }, toast) : null
  );

  function stress() {
    const ns = [], es = [];
    for (let i = 0; i < 100; i += 1) {
      const table = i % 2 === 0;
      const id = 'stress:' + i;
      ns.push({ id, type: 'rich', position: { x: (i % 10) * 250, y: Math.floor(i / 10) * 100 }, data: { name: table ? 'dws.t_' + i : 'ETL job_' + i, kind: table ? 'DWS' : 'ETL', meta: table ? 'ClickHouse · 压测' : 'Spark · 压测', icon: table ? ICON.clickhouse : ICON.spark, iconBg: table ? palette.clickhouse : palette.job }, width: 220, height: 62 });
      if (i > 0) es.push({ id: 's' + i, source: 'stress:' + (i - 1), target: id, type: 'smoothstep', style: { stroke: '#7d99ea', strokeWidth: 1 } });
    }
    setNodes(ns); setEdges(es); setSelectedId(null);
    setTimeout(() => fitAll(ns), 30);
    setToast('100 节点压测 · React Flow DOM 节点');
  }
}

function defaultTab(id) {
  const info = INFO[id];
  if (!info) return 'overview';
  if (info.sql) return 'transform';
  if (info.fields) return 'fields';
  return 'overview';
}

function Detail(props) {
  const { info, selected, selectedId, tab, setTab, setSelectedId, setToast } = props;
  if (!selected || !info) {
    return h(React.Fragment, null,
      h('div', { className: 'detail-head' }, h('div', { className: 'eyebrow' }, 'Node detail'), h('h2', null, '点击任意节点')),
      h('div', { className: 'detail-body' }, h('div', { className: 'empty' }, '表看库/schema/字段，作业看 SQL/输入输出，调度任务看 job 列表。')));
  }
  const tabs = [['overview', '概览']];
  if (info.fields) tabs.push(['fields', '字段']);
  if (info.schedule || info.jobs) tabs.push(['schedule', '调度']);
  if (info.sql) tabs.push(['transform', '加工']);
  const active = tabs.some(t => t[0] === tab) ? tab : 'overview';
  return h(React.Fragment, null,
    h('div', { className: 'detail-head' },
      h('div', { className: 'eyebrow' }, h('span', null, info.kind), h('button', { className: 'dt', onClick: () => setSelectedId(null) }, '×')),
      h('h2', null, selected.data.name || selected.data.label || selected.id),
      h('div', { className: 'detail-sub' }, info.subtitle),
      h('div', { className: 'pills' }, (info.badges || []).map(b => h('span', { key: b, className: 'pill' + (b === '本次目标' ? ' brand' : '') }, b)))),
    h('div', { className: 'detail-tabs' }, tabs.map(t => h('button', { key: t[0], className: 'dt', 'data-active': String(active === t[0]), onClick: () => setTab(t[0]) }, t[1]))),
    h('div', { className: 'detail-body' }, content(info, active)),
    h('div', { className: 'detail-foot' },
      h('button', { className: 'tool', onClick: () => setToast('Mock：内网对接后跳 DataMap / 调度平台') }, '在 DataMap 查看'),
      h('button', { className: 'tool', onClick: () => { if (navigator.clipboard) navigator.clipboard.writeText(selected.data.name || selected.data.label || selected.id); setToast('已复制节点名称'); } }, '复制名称')));
}

function content(info, tab) {
  if (tab === 'fields' && info.fields) {
    return h('table', { className: 'fields' },
      h('thead', null, h('tr', null, h('th', null, '字段'), h('th', null, '类型'), h('th', null, '说明'))),
      h('tbody', null, info.fields.map(f => h('tr', { key: f[0] }, h('td', null, f[0]), h('td', null, f[1]), h('td', null, f[2])))));
  }
  if (tab === 'schedule') {
    const s = info.schedule || {};
    const rows = [];
    if (s.cycle) rows.push(['周期', s.cycle]);
    if (s.cron) rows.push(['cron', s.cron]);
    if (s.sla) rows.push(['SLA', s.sla]);
    if (s.task) rows.push(['调度任务', s.task]);
    if (s.depends) rows.push(['依赖', s.depends.join('、')]);
    return h(React.Fragment, null,
      rows.length ? h('dl', { className: 'kv' }, rows.map(r => h(React.Fragment, { key: r[0] }, h('dt', null, r[0]), h('dd', null, r[1])))) : null,
      info.jobs ? h(React.Fragment, null,
        h('div', { className: 'section-title' }, '包含作业'),
        h('div', { className: 'jobs' }, info.jobs.map(j => h('div', { key: j[0], className: 'job-row' }, h('span', { className: 'idx' }, j[0]), h('span', { className: 'name' }, j[1]), h('span', { className: 'kind' }, j[2]))))) : null);
  }
  if (tab === 'transform' && info.sql) return h('pre', { className: 'sql' }, info.sql);
  return h(React.Fragment, null,
    info.desc ? h('p', { className: 'desc' }, info.desc) : null,
    h('dl', { className: 'kv' }, (info.rows || []).map(r => h(React.Fragment, { key: r[0] }, h('dt', null, r[0]), h('dd', null, r[1])))));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(ReactFlowProvider, null, h(App)));
</script>
</body>
</html>
